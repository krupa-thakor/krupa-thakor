<!DOCTYPE html>
<html>
<head>
    <title>Image Hover Effect</title>

    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f2f2f2;
        }

        .image-box{
            width:300px;
            overflow:hidden;
            border-radius:15px;
        }

        .image-box img{
            width:100%;
            transition:0.5s;
        }

        .image-box img:hover{
            transform:scale(1.1);
            filter:brightness(70%);
        }
    </style>
</head>

<body>

    <div class="image-box">
        <img src="https://images.unsplash.com/photo-1437482078695-73f5ca6c96e2?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cml2ZXJ8ZW58MHx8MHx8fDA%3D"
             alt="Nature Image">
    </div>

</body>
</html>
